openapi: 3.0.1
info:
  contact:
    email: support@amportfolio.com
    name: AM Portfolio Team
  description: "API documentation for the Market Data service providing access to\
    \ stock quotes, historical data, market indices, brokerage calculations, and more."
  license:
    name: Private License
    url: https://amportfolio.com/license
  title: Market Data API Documentation
  version: 1.0.0
servers:
- description: Default Server URL
  url: /
tags:
- description: Endpoints for retrieving market index data
  name: Market Indices
- description: "Endpoints for searching and retrieving security metadata (sector,\
    \ industry, market cap)"
  name: Security Metadata
- description: "Endpoints for calculating brokerage, taxes, and other charges"
  name: Brokerage Calculator
- description: "APIs for retrieving various types of market data including quotes,\
    \ historical data, option chains, and more"
  name: Market Data
- description: Endpoints for retrieving stock indices constituent data
  name: Stock Indices
- description: Endpoints for calculating margin requirements for trades
  name: Margin Calculator
- description: Endpoints for real-time market data polling
  name: Market Data Polling
- description: "Endpoints for market analytics, summaries, and insights"
  name: Market Analytics
paths:
  /api/v1/stock-indices/batch:
    post:
      description: Returns constituent stocks for multiple indices
      operationId: getStockIndicesBatch
      parameters:
      - explode: true
        in: query
        name: forceRefresh
        required: false
        schema:
          default: false
          type: boolean
        style: form
      requestBody:
        content:
          application/json:
            schema:
              items:
                type: string
              type: array
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/NSEStockIndicesDataV1"
                type: array
          description: OK
      summary: Get multiple stock indices
      tags:
      - Stock Indices
      x-content-type: application/json
      x-accepts:
      - '*/*'
  /api/v1/security/search:
    post:
      description: Search for securities using various filters
      operationId: search
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecuritySearchRequestV1"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/SecurityDTOV1"
                type: array
          description: OK
      summary: Search securities
      tags:
      - Security Metadata
      x-content-type: application/json
      x-accepts:
      - '*/*'
  /api/v1/polling/unsubscribe:
    post:
      description: Unsubscribe from symbols
      operationId: unsubscribe
      requestBody:
        content:
          application/json:
            schema:
              items:
                type: string
              type: array
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                additionalProperties:
                  type: object
                type: object
          description: OK
      summary: Unsubscribe from symbols
      tags:
      - Market Data Polling
      x-content-type: application/json
      x-accepts:
      - '*/*'
  /api/v1/polling/subscribe:
    post:
      description: Subscribe to symbols for real-time updates
      operationId: subscribe
      requestBody:
        content:
          application/json:
            schema:
              items:
                type: string
              type: array
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                additionalProperties:
                  type: object
                type: object
          description: OK
      summary: Subscribe to symbols
      tags:
      - Market Data Polling
      x-content-type: application/json
      x-accepts:
      - '*/*'
  /api/v1/market-data/quotes:
    get:
      description: Retrieves latest quotes for multiple symbols with support for different
        timeframes
      operationId: getQuotes
      parameters:
      - explode: true
        in: query
        name: symbols
        required: true
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: timeFrame
        required: false
        schema:
          default: 5m
          type: string
        style: form
      - explode: true
        in: query
        name: refresh
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: object
                type: object
          description: Quotes retrieved successfully
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: object
                type: object
          description: Invalid request parameters
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: object
                type: object
          description: Internal server error
      summary: Get quotes for multiple symbols
      tags:
      - Market Data
      x-accepts:
      - application/json
    post:
      description: Retrieves latest quotes for multiple symbols with support for different
        timeframes using POST request
      operationId: getQuotesPost
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: object
                type: object
          description: Quotes retrieved successfully
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: object
                type: object
          description: Invalid request parameters
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: object
                type: object
          description: Internal server error
      summary: Get quotes for multiple symbols (POST)
      tags:
      - Market Data
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/market-data/ohlc:
    post:
      description: Retrieves Open-High-Low-Close data for multiple symbols with support
        for different timeframes
      operationId: getOHLC
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OHLCRequest"
        required: true
      responses:
        "400":
          content:
            application/json:
              schema:
                type: object
          description: Invalid request parameters
        "500":
          content:
            application/json:
              schema:
                type: object
          description: Internal server error
        "200":
          content:
            application/json:
              schema:
                type: object
          description: OHLC data retrieved successfully
      summary: Get OHLC data for multiple symbols
      tags:
      - Market Data
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/market-data/historical-data:
    post:
      description: Retrieves historical price and volume data for one or more instruments
        with filtering options
      operationId: getHistoricalData
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HistoricalDataRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricalDataResponseV1"
          description: Historical data retrieved successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricalDataResponseV1"
          description: Invalid request parameters
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricalDataResponseV1"
          description: Internal server error
      summary: Get historical market data
      tags:
      - Market Data
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/market-data/auth/logout:
    post:
      description: Invalidates the current broker session and clears authentication
        tokens
      operationId: logout
      responses:
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: object
                type: object
          description: Internal server error
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: object
                type: object
          description: Logout successful
      summary: Logout and invalidate session
      tags:
      - Market Data
      x-accepts:
      - application/json
  /api/v1/margin/calculate:
    post:
      description: "Calculates SPAN, exposure, and total margin requirements for various\
        \ positions"
      operationId: calculateMargin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarginCalculationRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MarginCalculationResponse"
          description: OK
      summary: Calculate margin requirements
      tags:
      - Margin Calculator
      x-content-type: application/json
      x-accepts:
      - '*/*'
  /api/v1/brokerage/calculate:
    post:
      description: "Calculates total brokerage, taxes, and other charges based on\
        \ trade details"
      operationId: calculateBrokerage
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrokerageCalculationRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BrokerageCalculationResponse"
          description: OK
      summary: Calculate brokerage and charges
      tags:
      - Brokerage Calculator
      x-content-type: application/json
      x-accepts:
      - '*/*'
  /api/v1/stock-indices/{indexSymbol}:
    get:
      description: Returns constituent stocks for a specific index
      operationId: getStockIndices
      parameters:
      - explode: false
        in: path
        name: indexSymbol
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: forceRefresh
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NSEStockIndicesDataV1"
          description: OK
      summary: Get stock indices data
      tags:
      - Stock Indices
      x-accepts:
      - '*/*'
  /api/v1/stock-indices/available:
    get:
      description: Returns list of available broad market and sector indices
      operationId: getAvailableIndices
      responses:
        "200":
          content:
            '*/*':
              schema:
                additionalProperties:
                  items:
                    type: string
                  type: array
                type: object
          description: OK
      summary: Get available indices
      tags:
      - Stock Indices
      x-accepts:
      - '*/*'
  /api/v1/security/sectors:
    get:
      description: Returns a mapping of symbol to sector
      operationId: getSectors
      parameters:
      - explode: true
        in: query
        name: symbols
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            '*/*':
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
      summary: Get sectors for symbols
      tags:
      - Security Metadata
      x-accepts:
      - '*/*'
  /api/v1/security/find:
    get:
      description: Returns metadata for specific symbols
      operationId: findBySymbols
      parameters:
      - explode: true
        in: query
        name: symbols
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/SecurityDTOV1"
                type: array
          description: OK
      summary: Find securities by symbols
      tags:
      - Security Metadata
      x-accepts:
      - '*/*'
  /api/v1/security/all:
    get:
      description: Returns all available securities in the database
      operationId: getAll
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/SecurityDTOV1"
                type: array
          description: OK
      summary: Get all securities
      tags:
      - Security Metadata
      x-accepts:
      - '*/*'
  /api/v1/polling/status:
    get:
      description: Returns streaming connection status
      operationId: getConnectionStatus
      responses:
        "200":
          content:
            '*/*':
              schema:
                additionalProperties:
                  type: object
                type: object
          description: OK
      summary: Get connection status
      tags:
      - Market Data Polling
      x-accepts:
      - '*/*'
  /api/v1/polling/schema/update:
    get:
      operationId: getUpdateSchema
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MarketDataUpdateV1"
          description: OK
      summary: Internal use for SDK generation
      tags:
      - Market Data Polling
      x-accepts:
      - '*/*'
  /api/v1/polling/data:
    get:
      description: Poll live market data for given symbols
      operationId: pollMarketData
      parameters:
      - explode: true
        in: query
        name: symbols
        required: true
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: timeFrame
        required: false
        schema:
          default: 1m
          type: string
        style: form
      - explode: true
        in: query
        name: indexSymbol
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "200":
          content:
            '*/*':
              schema:
                additionalProperties:
                  type: object
                type: object
          description: OK
      summary: Poll market data
      tags:
      - Market Data Polling
      x-accepts:
      - '*/*'
  /api/v1/market-data/symbols/{exchange}:
    get:
      description: Retrieves all available trading symbols for a specific exchange
      operationId: getSymbolsForExchange
      parameters:
      - explode: false
        in: path
        name: exchange
        required: true
        schema:
          type: string
        style: simple
      responses:
        "500":
          content:
            application/json:
              schema:
                items:
                  type: object
                type: array
          description: Internal server error
        "200":
          content:
            application/json:
              schema:
                items:
                  type: object
                type: array
          description: Symbols retrieved successfully
      summary: Get symbols for a specific exchange
      tags:
      - Market Data
      x-accepts:
      - application/json
  /api/v1/market-data/option-chain:
    get:
      description: Retrieves option chain data including calls and puts for a given
        underlying instrument
      operationId: getOptionChain
      parameters:
      - explode: true
        in: query
        name: symbol
        required: true
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: expiryDate
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: refresh
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: object
                type: object
          description: Invalid request parameters
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: object
                type: object
          description: Internal server error
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: object
                type: object
          description: Option chain data retrieved successfully
      summary: Get option chain data
      tags:
      - Market Data
      x-accepts:
      - application/json
  /api/v1/market-data/mutual-fund/{schemeCode}:
    get:
      description: "Retrieves detailed information about a mutual fund including NAV,\
        \ returns, and other metrics"
      operationId: getMutualFundDetails
      parameters:
      - explode: false
        in: path
        name: schemeCode
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: refresh
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: object
                type: object
          description: Mutual fund details retrieved successfully
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: object
                type: object
          description: Internal server error
      summary: Get mutual fund details
      tags:
      - Market Data
      x-accepts:
      - application/json
  /api/v1/market-data/mutual-fund/{schemeCode}/history:
    get:
      description: Retrieves historical Net Asset Value (NAV) data for a mutual fund
        over a specified date range
      operationId: getMutualFundNavHistory
      parameters:
      - explode: false
        in: path
        name: schemeCode
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: from
        required: true
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: to
        required: true
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: refresh
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: object
                type: object
          description: Internal server error
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: object
                type: object
          description: NAV history retrieved successfully
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: object
                type: object
          description: Invalid date format or request parameters
      summary: Get mutual fund NAV history
      tags:
      - Market Data
      x-accepts:
      - application/json
  /api/v1/market-data/live-prices:
    get:
      description: Retrieves real-time market prices for specified symbols or all
        available symbols
      operationId: getLivePrices
      parameters:
      - explode: true
        in: query
        name: symbols
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: isIndexSymbol
        required: false
        schema:
          type: boolean
        style: form
      - explode: true
        in: query
        name: refresh
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: object
                type: object
          description: Internal server error
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: object
                type: object
          description: Live prices retrieved successfully
      summary: Get live market prices
      tags:
      - Market Data
      x-accepts:
      - application/json
  /api/v1/market-data/live-ltp:
    get:
      description: Retrieves current LTP and calculates change based on historical
        closing price for the specified timeframe
      operationId: getLiveLTP
      parameters:
      - explode: true
        in: query
        name: symbols
        required: true
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: timeframe
        required: false
        schema:
          default: 1D
          type: string
        style: form
      - explode: true
        in: query
        name: isIndexSymbol
        required: false
        schema:
          default: true
          type: boolean
        style: form
      - explode: true
        in: query
        name: refresh
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: object
                type: object
          description: Internal server error
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: object
                type: object
          description: Live LTP with change retrieved successfully
      summary: Get live LTP with change calculation
      tags:
      - Market Data
      x-accepts:
      - application/json
  /api/v1/market-data/auth/session:
    get:
      description: Creates a new authenticated session using the request token obtained
        from broker login
      operationId: generateSession
      parameters:
      - explode: true
        in: query
        name: request_token
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: requestToken
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: code
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: status
        required: false
        schema:
          default: success
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Session generated successfully
        "500":
          content:
            application/json:
              schema:
                type: object
          description: Internal server error
        "400":
          content:
            application/json:
              schema:
                type: object
          description: Invalid request token or authentication failed
      summary: Generate session from request token
      tags:
      - Market Data
      x-accepts:
      - application/json
  /api/v1/market-data/auth/login-url:
    get:
      description: Returns a URL that can be used to authenticate with the broker's
        login page
      operationId: getLoginUrl
      parameters:
      - explode: true
        in: query
        name: provider
        required: false
        schema:
          type: string
        style: form
      responses:
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal server error
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Login URL generated successfully
      summary: Get login URL for broker authentication
      tags:
      - Market Data
      x-accepts:
      - application/json
  /api/v1/indices/{symbol}:
    get:
      description: Returns a specific index by its symbol
      operationId: getIndex
      parameters:
      - explode: false
        in: path
        name: symbol
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NSEIndexV1"
          description: OK
      summary: Get index by symbol
      tags:
      - Market Indices
      x-accepts:
      - '*/*'
  /api/v1/indices/all:
    get:
      description: Returns all available market indices
      operationId: getAllIndices
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/NSEIndexV1"
                type: array
          description: OK
      summary: Get all market indices
      tags:
      - Market Indices
      x-accepts:
      - '*/*'
  /api/v1/analytics/summary:
    get:
      description: Returns overall market summary with key metrics
      operationId: getMarketSummary
      responses:
        "200":
          content:
            '*/*':
              schema:
                additionalProperties:
                  type: object
                type: object
          description: OK
      summary: Get market summary
      tags:
      - Market Analytics
      x-accepts:
      - '*/*'
  /api/v1/analytics/sectors:
    get:
      description: Returns sector-wise performance data
      operationId: getSectorPerformance
      responses:
        "200":
          content:
            '*/*':
              schema:
                additionalProperties:
                  type: object
                type: object
          description: OK
      summary: Get sector performance
      tags:
      - Market Analytics
      x-accepts:
      - '*/*'
  /api/v1/analytics/movers:
    get:
      description: Returns top gaining and losing stocks
      operationId: getTopMovers
      parameters:
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 10
          format: int32
          type: integer
        style: form
      responses:
        "200":
          content:
            '*/*':
              schema:
                additionalProperties:
                  items:
                    type: object
                  type: array
                type: object
          description: OK
      summary: Get top gainers and losers
      tags:
      - Market Analytics
      x-accepts:
      - '*/*'
  /api/v1/analytics/breadth:
    get:
      description: "Returns market breadth data (advances, declines, unchanged)"
      operationId: getMarketBreadth
      responses:
        "200":
          content:
            '*/*':
              schema:
                additionalProperties:
                  type: object
                type: object
          description: OK
      summary: Get market breadth
      tags:
      - Market Analytics
      x-accepts:
      - '*/*'
components:
  schemas:
    Advance:
      example:
        declines: declines
        advances: advances
        unchanged: unchanged
      properties:
        declines:
          type: string
        advances:
          type: string
        unchanged:
          type: string
      type: object
    IndexMetadata:
