# Spring Configuration
spring:
  application:
    name: market-data-service
  data:
    redis:
      host: ${REDIS_HOSTNAME}
      password: ${REDIS_PASSWORD}
      port: ${REDIS_PORT:6379}
    mongodb:
      uri: ${MONGODB_URL:mongodb://ssd2658:ssd2658@localhost:27017/market_data?authSource=admin}
      database: ${MONGODB_DATABASE}
      username: ${MONGODB_USERNAME}
      password: ${MONGODB_PASSWORD}

      
      authentication-database: admin
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID}
      auto-offset-reset: ${KAFKA_CONSUMER_AUTO_OFFSET_RESET}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  
  # InfluxDB Configuration
  influx:
    url: ${INFLUXDB_URL}
    token: ${INFLUXDB_TOKEN}
    org: ${INFLUXDB_ORG}
    bucket: ${INFLUXDB_BUCKET}

# Management and Metrics Configuration

  config:
    import:
      - classpath:isin.yml
      - classpath:nseindices.yml
      #- classpath:application-external-api.yml
      #- classpath:application-endpoints.yml
      - classpath:application-kafka.yml
      - classpath:application-zerodha.yml

market-data:
  stream:
    poll-interval-seconds: 60
  cache:
    enabled: true
    price-ttl-minutes: ${MARKET_DATA_CACHE_PRICE_TTL_MINUTES:15}
    history-ttl-minutes: ${MARKET_HISTORY_DATA_CACHE_HISTORY_TTL_MINUTES:15}
# Logging Configuration
logging:
  level:
    root: INFO
    '[com.am.marketdata]': INFO
    '[com.am.marketdata.scheduler]': INFO
    '[com.am.marketdata.service]': INFO
    '[com.am.marketdata.external.api]': INFO
    '[com.am.common.investment.service]': INFO
  # pattern:
  #   console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%p","thread":"%t","class":"%c","message":"%m"}%n'

upstox:
  interval: I1
  auth:
    base-url: https://api.upstox.com/v2
    code: ${UPSTOX_CODE}
    api-key: ${UPSTOX_API_KEY}
    secret-key: ${UPSTOX_SECRET_KEY}
    access-token: ${UPSTOX_ACCESS_TOKEN}
    redirect-uri: http://localhost:8092/api/v1/market-data/auth/session
    authorization-url: https://api-v2.upstox.com/login/authorization/dialog
    token-url: https://api-v2.upstox.com/login/authorization/token
    token-refresh-interval: 3600000
    scope: orders feed portfolio

scraper:
  urls:
    - https://www.nseindia.com/

# Server Configuration
server:
  port: 8092

scheduler:
  cookie:
    enabled: false
  stock-indices:
    enabled: false

# Management/Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      validate-group-membership: false
      group:
        readiness:
          include: diskSpace,mongodb,redis,kafka,influx
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    mongodb:
      enabled: true
    redis:
      enabled: true

    influxdb:
      enabled: true

jwt:
  secret: ${JWT_SECRET:internal-service-super-secret-key-32chars-minimum-change-in-prod}


  # Security Configuration
security:
  enabled: ${SECURITY_ENABLED:false}  # Disabled by default for development. Set SECURITY_ENABLED=true in production.